    * {

    body {
      background: linear-gradient(to right, #a0e9d1, #b3e5fc, #ffffff);
      color: #333;
      overflow-x: hidden;
    }

    header {
      background: linear-gradient(to right, #009688, #00bcd4);
      color: white;
      padding: 2rem;
      text-align: center;
      animation: fadeIn 2s ease;
    }

    header h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }

    header p {
      font-size: 1.2rem;
      font-style: italic;
    }

    nav {
      position: fixed;
      top: 1rem;
      left: 1rem;
      z-index: 1000;
    }

    .menu-toggle {
      width: 30px;
      height: 25px;
      cursor: pointer;
    }

    .menu-toggle span {
      display: block;
      height: 4px;
      background: #009688;
      margin: 5px 0;
      transition: 0.3s;
    }
